[project]
name = "financial-rag-qa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "langchain-openai>=1.7.4",
    "langfuse>=5.2.0",
    "openai>=3.46.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "torch>=2.11.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# RTX 5060(Blackwell)은 CUDA 12.8 이상 빌드가 필요하다. torch만 이 인덱스에서 받는다.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
